server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy /api/* to the backend Service (same namespace).
  location /api/ {
    proxy_pass http://backend.auid.svc.cluster.local:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }
}
